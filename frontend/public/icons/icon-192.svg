<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#334155" stroke-width="3"/>
  <!-- Decorative Ring -->
  <circle cx="96" cy="96" r="70" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- Central Badge (#0a0e17 with #10b981 border) -->
  <rect x="44" y="44" width="104" height="104" rx="24" fill="#0a0e17" stroke="#10b981" stroke-width="3.5"/>
  <!-- Amharic "ዋጋ" Text -->
  <text x="96" y="93" fill="#10b981" font-family="'Noto Sans Ethiopic', 'Abyssinica SIL', system-ui, sans-serif" font-size="36" font-weight="900" text-anchor="middle" dominant-baseline="middle">ዋጋ</text>
  <!-- Gold/amber uppercase text "WAGA STOCK" -->
  <text x="96" y="125" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="1.2">WAGA STOCK</text>
</svg>
