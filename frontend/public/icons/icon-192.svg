<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#334155" stroke-width="3"/>
  <!-- Decorative Ring -->
  <circle cx="96" cy="96" r="70" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- Central Badge -->
  <rect x="46" y="46" width="100" height="100" rx="24" fill="#09090b" stroke="#10b981" stroke-width="3"/>
  <!-- Amharic "ዋጋ" Text -->
  <text x="96" y="98" fill="#10b981" font-family="'Noto Sans Ethiopic', 'Abyssinica SIL', system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle" dominant-baseline="middle">ዋጋ</text>
  <text x="96" y="128" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="2">WAGA</text>
</svg>
