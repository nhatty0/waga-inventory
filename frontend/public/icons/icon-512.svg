<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gemGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" stroke="#334155" stroke-width="8"/>
  <!-- Decorative Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="5" stroke-dasharray="16 16"/>
  <!-- Central Badge -->
  <rect x="126" y="126" width="260" height="260" rx="64" fill="#09090b" stroke="#10b981" stroke-width="8"/>
  <!-- Amharic "ዋጋ" Text -->
  <text x="256" y="260" fill="#10b981" font-family="'Noto Sans Ethiopic', 'Abyssinica SIL', system-ui, sans-serif" font-size="96" font-weight="900" text-anchor="middle" dominant-baseline="middle">ዋጋ</text>
  <text x="256" y="340" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="30" font-weight="800" text-anchor="middle" letter-spacing="4">WAGA STOCK</text>
</svg>
